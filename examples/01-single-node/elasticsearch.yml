# Single-node Elasticsearch configuration (development only).
# SECURITY WARNING: xpack.security.enabled=false is the fleet's DEV
# configuration. Auth enablement is a follow-up decision. Never bind
# this configuration to a public interface and never ship it as a
# production setup.
cluster.name: cookbook-single-node
node.name: cookbook-node-1
path.data: ./data
path.logs: ./logs
network.host: 127.0.0.1
http.port: 9200
discovery.type: single-node
xpack.security.enabled: false
xpack.security.enrollment.enabled: false
xpack.security.http.ssl.enabled: false
xpack.security.transport.ssl.enabled: false
